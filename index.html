<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#62ad82"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<title>Meu Planejador Semanal</title><style>
:root{--g:#62ad82;--p:#e779a7;--b:#fff9fc;--t:#302a30;--m:#7d727a;--bd:#eadfe5}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(145deg,#e2f3e9,#fbe3ed,#fff);color:var(--t);min-height:100vh}.app{max-width:850px;margin:auto;padding:18px 12px 38px}header,.panel{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 7px 25px #69475d12}header{margin-bottom:12px}h1{margin:0 0 4px;font-size:27px}.sub{margin:0;color:var(--m)}.week{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.week b{font-size:18px}.nav,.top{display:flex;gap:6px}.nav button,.top button,.open{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.top{margin-bottom:10px}.top button.active{background:var(--g);color:#fff;border-color:var(--g)}.progress{margin-top:12px}.label{display:flex;justify-content:space-between;font-size:13px;color:var(--m);margin-bottom:5px}.track{height:9px;background:#eee6eb;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--p))}.days{display:flex;gap:6px;overflow:auto;padding-bottom:10px}.day{border:1px solid var(--bd);background:#fff;border-radius:13px;padding:8px 12px;white-space:nowrap;cursor:pointer}.day.active{background:var(--g);color:#fff;border-color:var(--g)}.day small,.history-row small{display:block;font-size:11px}.panel h2{font-size:21px;margin:0 0 13px}form{display:grid;grid-template-columns:100px 1fr auto;gap:7px;margin-bottom:15px}input{border:1px solid var(--bd);border-radius:11px;padding:11px;font-size:15px;min-width:0}.add{border:0;background:var(--p);color:#fff;border-radius:11px;padding:0 15px;font-weight:700}.tasks{display:flex;flex-direction:column;gap:8px}.task{display:grid;grid-template-columns:23px 1fr auto;gap:10px;align-items:center;border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:12px;padding:10px}.task input{width:19px;height:19px;accent-color:var(--g)}.title{font-weight:600;overflow-wrap:anywhere}.task small{color:var(--m)}.done .title{text-decoration:line-through;color:var(--m)}.delete{border:0;background:transparent;cursor:pointer;font-size:17px}.empty{text-align:center;color:var(--m);padding:24px}.history{display:flex;flex-direction:column;gap:8px}.history-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:11px;background:#edf8f2}.open{background:var(--g);color:#fff;border-color:var(--g)}.foot{text-align:center;color:var(--m);font-size:12px;margin-top:10px}@media(max-width:580px){form{grid-template-columns:88px 1fr}.add{grid-column:1/-1;height:43px}.history-row{grid-template-columns:1fr auto}.history-row .delete{grid-column:2;grid-row:1}}
</style></head><body><div class="app"><header><h1>🌷 Meu Planejador Semanal</h1><p class="sub">Organize sua semana e guarde seu histórico.</p><div class="week"><b id="weekTitle"></b><div class="nav"><button id="prev">← Anterior</button><button id="today">Semana atual</button><button id="next">Próxima →</button></div></div><div class="progress"><div class="label"><span>Progresso da semana</span><b id="pct">0%</b></div><div class="track"><div class="bar" id="bar"></div></div></div></header><nav class="top"><button id="weekTab" class="active">📅 Semana</button><button id="historyTab">🗂️ Semanas anteriores</button></nav><section id="weekView" class="panel"><nav class="days" id="days"></nav><h2 id="dayTitle"></h2><form id="form"><input id="time" type="time"><input id="text" placeholder="Adicionar tarefa..." required><button class="add">+ Adicionar</button></form><div class="tasks" id="tasks"></div></section><section id="historyView" class="panel" hidden><h2>🗂️ Semanas anteriores</h2><p class="sub">Escolha uma semana para consultar ou excluir.</p><div class="history" id="history"></div></section><div class="foot">Salvo automaticamente neste dispositivo.</div></div><script src="app.js"></script></body></html>
